# Throw-away test stack: stock n8n + Mailpit (SMTP capture; nothing leaves this machine).
# Used by tests/integration/run.sh. Images are pinned by digest.
services:
  mail:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    command: ["--smtp-auth-accept-any", "--smtp-auth-allow-insecure"]
    ports: ["127.0.0.1:${F2_MAIL_PORT:-18025}:8025"]
  n8n:
    image: n8nio/n8n:2.43.4@sha256:c34ee9107a42b837e25cec0c8a927ab90a45b776aa2ccbf15e5b9cda466fad2c
    environment:
      N8N_ENCRYPTION_KEY: ${F2_ENCRYPTION_KEY:?set by run.sh}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
      SMTP_HOST: mail
      SMTP_PORT: "1025"
    volumes: ["../../workflow:/workflow:ro", "n8n-data:/home/node/.n8n"]
    ports: ["127.0.0.1:${F2_N8N_PORT:-15678}:5678"]
volumes:
  n8n-data:
